vetica" font-size="13" lengthAdjust="spacing" textLength="146.9038" x="119.11" y="540.6369">restores full RM bound</text></g><!--link PE to SS--><g class="link" data-entity-1="ent0005" data-entity-2="ent0006" data-link-type="dependency" data-source-line="35" id="lnk14"><path d="M118.11,664.88 C118.11,688.86 118.11,713.15 118.11,735.96" fill="none" id="PE-to-SS" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="118.11,740.96,122.11,731.96,118.11,735.96,114.11,731.96,118.11,740.96" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="155.3906" x="119.11" y="707.4769">simpler implementation</text></g><!--link SS to DSS--><g class="link" data-entity-1="ent0006" data-entity-2="ent0007" data-link-type="dependency" data-source-line="38" id="lnk15"><path d="M118.11,817.78 C118.11,841.59 118.11,867.02 118.11,889.24" fill="none" id="SS-to-DSS" style="stroke:#181818;stroke-width:1;stroke-dasharray:7,7;"/><polygon fill="#181818" points="118.11,894.24,122.11,885.24,118.11,889.24,114.11,885.24,118.11,894.24" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="73.6646" x="119.11" y="860.3469">port to EDF</text></g><!--link DSS to TBS--><g class="link" data-entity-1="ent0007" data-entity-2="ent0008" data-link-type="dependency" data-source-line="41" id="lnk16"><path d="M118.11,956.4 C118.11,978.65 118.11,1004.06 118.11,1027.84" fill="none" id="DSS-to-TBS" style="stroke:#181818;stroke-width:1;"/><polygon fill="#181818" points="118.11,1032.84,122.11,1023.84,118.11,1027.84,114.11,1023.84,118.11,1032.84" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text fill="#000000" font-family="Helvetica" font-size="13" lengthAdjust="spacing" textLength="88.0356" x="119.11" y="999.2569">full ut