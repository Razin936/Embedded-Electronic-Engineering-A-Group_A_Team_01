<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="DESCRIPTION" height="1275px" preserveAspectRatio="none" style="width:290px;height:1275px;background:#FFFFFF;" version="1.1" viewBox="0 0 290 1275" width="290px" zoomAndPan="magnify"><?plantuml 1.2026.5?><defs/><g><!--entity LL--><g class="entity" data-qualified-name="LL" data-source-line="16" id="ent0001"><rect fill="#E7E6E6" height="61.9063" rx="6" ry="6" style="stroke:#555555;stroke-width:0.5;" width="145.3789" x="45.42" y="7"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="125.3789" x="55.42" y="28.1387">Liu &amp; Layland (1973)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="122.6367" x="55.42" y="42.1074">RM / EDF foundation</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="111.791" x="55.42" y="56.0762">U &lt;= n(2^(1/n)-1)</text></g><!--entity BG--><g class="entity" data-qualified-name="BG" data-source-line="19" id="ent0002"><rect fill="#D5E8F0" height="61.9063" rx="6" ry="6" style="stroke:#555555;stroke-width:0.5;" width="165.5117" x="35.35" y="129.91"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="71.8535" x="45.35" y="151.0487">Background</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="54.2051" x="45.35" y="165.0174">(folklore)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="145.5117" x="45.35" y="178.9862">runs only when CPU idle</text></g><!--entity PS--><g class="entity" data-qualified-name="PS" data-source-line="20" id="ent0003"><rect fill="#D5E8F0" height="75.875" rx="6" ry="6" style="stroke:#555555;stroke-width:0.5;" width="172.3145" x="31.95" y="268.82"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="111" x="41.95" y="289.9587">Polling Server (PS)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="49.957" x="41.95" y="303.9274">(~1985)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="103.1895" x="41.95" y="317.8962">bounded budget;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="152.3145" x="41.95" y="331.8649">discards unused capacity</text></g><!--entity DS--><g class="entity" data-qualified-name="DS" data-source-line="21" id="ent0004"><rect fill="#D5E8F0" height="75.875" rx="6" ry="6" style="stroke:#555555;stroke-width:0.5;" width="202.7012" x="16.76" y="421.69"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="136.9863" x="26.76" y="442.8287">Deferrable Server (DS)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="182.7012" x="26.76" y="456.7974">Lehoczky/Sha/Strosnider 1987</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="117.7559" x="26.76" y="470.7662">preserves capacity;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="177.7266" x="26.76" y="484.7349">reduced schedulability bound</text></g><!--entity PE--><g class="entity" data-qualified-name="PE" data-source-line="22" id="ent0005"><rect fill="#FFF2CC" height="89.8438" rx="6" ry="6" style="stroke:#555555;stroke-width:0.5;" width="185.3906" x="25.41" y="574.57"/><rect fill="#000000" height="3.5" width="3.5" x="44.41" y="588.5388"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="149.3906" x="51.41" y="595.7087">Priority Exchange (PE) **</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="161.0625" x="35.41" y="609.6774">Sprunt/Sha/Lehoczky 1989</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="127.582" x="35.41" y="623.6462">preserves capacity +</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="97.207" x="35.41" y="637.6149">FULL RM bound;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="149.959" x="35.41" y="651.5837">complex implementation</text></g><!--entity SS--><g class="entity" data-qualified-name="SS" data-source-line="23" id="ent0006"><rect fill="#D5E8F0" height="75.875" rx="6" ry="6" style="stroke:#555555;stroke-width:0.5;" width="181.0625" x="27.58" y="741.41"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="123.9902" x="37.58" y="762.5487">Sporadic Server (SS)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="161.0625" x="37.58" y="776.5174">Sprunt/Sha/Lehoczky 1989</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="155.1621" x="37.58" y="790.4862">per-usage replenishment;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="94.2598" x="37.58" y="804.4549">simpler than PE</text></g><!--entity DSS--><g class="entity" data-qualified-name="DSS" data-source-line="26" id="ent0007"><rect fill="#E2EFDA" height="61.9063" rx="6" ry="6" style="stroke:#555555;stroke-width:0.5;" width="209.9668" x="13.13" y="894.28"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="189.9668" x="23.13" y="915.4187">Dynamic Sporadic Server (DSS)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="122.0449" x="23.13" y="929.3874">Spuri/Buttazzo 1994</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="86.5664" x="23.13" y="943.3562">EDF port of SS</text></g><!--entity TBS--><g class="entity" data-qualified-name="TBS" data-source-line="27" id="ent0008"><rect fill="#E2EFDA" height="75.875" rx="6" ry="6" style="stroke:#555555;stroke-width:0.5;" width="197.2871" x="19.47" y="1033.19"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="177.2871" x="29.47" y="1054.3287">Total Bandwidth Server (TBS)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="122.0449" x="29.47" y="1068.2974">Spuri/Buttazzo 1994</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="85.3066" x="29.47" y="1082.2662">full utilization;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="165.5156" x="29.47" y="1096.2349">bandwidth-based deadlines</text></g><!--entity CBS--><g class="entity" data-qualified-name="CBS" data-source-line="28" id="ent0009"><rect fill="#E2EFDA" height="75.875" rx="6" ry="6" style="stroke:#555555;stroke-width:0.5;" width="222.2188" x="7" y="1186.07"/><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="202.2188" x="17" y="1207.2087">Constant Bandwidth Server (CBS)</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="125.0859" x="17" y="1221.1774">Abeni/Buttazzo 1998</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="112.8164" x="17" y="1235.1462">temporal isolation;</text><text fill="#000000" font-family="Helvetica" font-size="12" lengthAdjust="spacing" textLength="195.0469" x="17" y="1249.1149">basis of Linux SCHED_DEADLINE</text></g><!--link LL to BG--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" data-link-type="dependency" data-source-line="31" id="lnk10"><path d="M106.9,69.15 C104.85,87.62 104.2984,106.1905 106.3484,124.6605" fill="none" id="LL-to-BG" style="s